name: Scheduled Farm & Feed/Water Web Push Notifications

on:
  schedule:
    # Bangladesh Time (UTC+6) — off-peak minutes + backup retry so GitHub never drops a run:
    - cron: '2 0 * * *'    # 06:02 AM BDT - Morning medicine
    - cron: '22 0 * * *'   # 06:22 AM BDT - Morning medicine backup
    - cron: '3 6 * * *'    # 12:03 PM BDT - Noon medicine
    - cron: '23 6 * * *'   # 12:23 PM BDT - Noon medicine backup
    - cron: '57 6 * * *'   # 12:57 PM BDT - 1:00 PM Feed & Water check
    - cron: '17 7 * * *'   # 01:17 PM BDT - 1:00 PM Feed & Water backup
    - cron: '27 9 * * *'   # 03:27 PM BDT - 3:30 PM Feed & Water check
    - cron: '47 9 * * *'   # 03:47 PM BDT - 3:30 PM Feed & Water backup
    - cron: '3 10 * * *'   # 04:03 PM BDT - Night medicine unlock
    - cron: '23 10 * * *'  # 04:23 PM BDT - Night medicine unlock backup
    - cron: '57 14 * * *'  # 08:57 PM BDT - 9:00 PM Feed & Water check
    - cron: '17 15 * * *'  # 09:17 PM BDT - 9:00 PM Feed & Water backup
  workflow_dispatch:
    inputs:
      force_slot:
        description: 'Optional test slot (feed_water_1300, feed_water_1530, feed_water_2100, med_check, test_all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-save --no-audit --no-fund web-push

      - name: Send Scheduled Farm & Medicine Push Notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_SECRET: ${{ secrets.FIREBASE_DATABASE_SECRET }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}
        run: node scripts/send-push-notifications.mjs
